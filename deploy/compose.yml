# Build from this checkout; no published container registry image is assumed.
services:
  hub:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        # Empty uses the version declared in the checked-out source.
        VERSION: ${ROOST_VERSION:-}
    image: roost:local
    command: ["hub", "serve", "--config", "/state/hub.json"]
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - roost-state:/state
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    stop_grace_period: 15s

volumes:
  roost-state:
