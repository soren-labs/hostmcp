name: Release

on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Archive version (manual branch runs build artifacts only)'
        required: true
        default: v0.3.0

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      GOFLAGS: -mod=readonly
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.27.3'
          cache: true
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - name: Build native executable for CLI validation
        run: go build -trimpath -o build/rmc ./cmd/rmc
      - name: Smoke test stdio CLI and eleven native tools
        run: python3 scripts/smoke.py --binary ./build/rmc --mode stdio

  build:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOFLAGS: -mod=readonly
      RELEASE_VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || github.event.inputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.27.3'
          cache: true
      - name: Build release archives and checksums
        run: bash scripts/release.sh "$RELEASE_VERSION"
      - name: Verify component packaging and offline updater
        run: python3 scripts/packaging-smoke.py --dist dist --version "$RELEASE_VERSION"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-archives
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: |
            CHANGELOG.md
            scripts/changelog-notes.sh
          sparse-checkout-cone-mode: false
      - name: Extract release notes from CHANGELOG.md
        # A release candidate (vX.Y.Z-rc.N) may use the Unreleased section.
        run: |
          if sh scripts/changelog-notes.sh "$GITHUB_REF_NAME" > "$RUNNER_TEMP/release-notes.md"; then
            exit 0
          fi
          case "$GITHUB_REF_NAME" in
            *-rc.*) sh scripts/changelog-notes.sh Unreleased > "$RUNNER_TEMP/release-notes.md" && exit 0 ;;
          esac
          echo "::error::CHANGELOG.md has no section for $GITHUB_REF_NAME"
          exit 1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-archives
          path: dist
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        # CI never publishes: devices install only releases signed with the
        # offline release key, so the owner runs scripts/sign-release.sh, which
        # verifies these assets, signs SHA256SUMS and publishes the draft.
        # The changelog section comes first; --generate-notes appends the PR list.
        run: |
          prerelease=
          case "$GITHUB_REF_NAME" in *-rc.*) prerelease=--prerelease ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --draft $prerelease \
            --title "RMC $GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/release-notes.md" --generate-notes
          echo "Draft created. Sign and publish: bash scripts/sign-release.sh $GITHUB_REF_NAME" >> "$GITHUB_STEP_SUMMARY"
