name: Release

on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Archive version (manual branch runs build artifacts only)'
        required: true
        default: v0.2.4

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      GOFLAGS: -mod=readonly
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: true
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - name: Build native executable for CLI validation
        run: go build -trimpath -o build/hostmcp ./cmd/hostmcp
      - name: Smoke test stdio CLI and nine native tools
        run: python3 scripts/smoke.py --binary ./build/hostmcp --mode stdio

  build:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOFLAGS: -mod=readonly
      RELEASE_VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || github.event.inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: true
      - name: Build release archives and checksums
        run: bash scripts/release.sh "$RELEASE_VERSION"
      - name: Verify component packaging and offline updater
        run: python3 scripts/packaging-smoke.py --dist dist --version "$RELEASE_VERSION"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-archives
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            CHANGELOG.md
            scripts/changelog-notes.sh
          sparse-checkout-cone-mode: false
      - name: Extract release notes from CHANGELOG.md
        run: |
          if ! sh scripts/changelog-notes.sh "$GITHUB_REF_NAME" > "$RUNNER_TEMP/release-notes.md"; then
            echo "::error::CHANGELOG.md has no section for $GITHUB_REF_NAME"
            exit 1
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-archives
          path: dist
      - name: Publish verified tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        # The changelog section comes first; --generate-notes appends the PR list.
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag
          --title "HostMCP $GITHUB_REF_NAME"
          --notes-file "$RUNNER_TEMP/release-notes.md" --generate-notes
