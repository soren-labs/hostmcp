name: Feature request
description: Suggest a change to HostMCP's tools, deployment or workflow.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: How should HostMCP behave? Include example commands or tool calls if useful.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and workarounds
  - type: markdown
    attributes:
      value: |
        HostMCP deliberately runs tools with the full ordinary authority of each node's OS account,
        without directory or command allowlists, and keeps the Hub from executing commands.
        Proposals that change these boundaries need a strong justification; see [docs/security.md](https://github.com/soren-labs/hostmcp/blob/main/docs/security.md).
